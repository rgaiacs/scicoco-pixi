[workspace]
authors = ["Raniere Silva <raniere@rgaiacs.com>"]
channels = ["conda-forge"]
name = "magic-square"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[tasks.download]
args = [
    {
        "arg" = "version",
        "default" = "43",
        "choices" = ["43", "45"]
    },
]
cmd = "curl --location --output gplk-{{ version }}.tar.gz https://ftp.gnu.org/gnu/glpk/glpk-{{ version }}.tar.gz"
outputs = ["gplk-{{ version }}.tar.gz"]

[dependencies]
curl = ">=8.22.0,<9"
gcc = ">=16.2.0,<16.3"
make = ">=4.4.1,<5"
gzip = ">=1.14,<2"
tar = ">=1.35,<2"
